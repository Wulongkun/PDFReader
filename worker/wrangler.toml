# PDFReader 激活服务
name = "pdfreader-activate"
main = "worker.js"
compatibility_date = "2024-11-01"

# 私钥/公钥不写在这里，用 secret 注入：
#   cd worker
#   wrangler secret put ACTIVATION_PRIVATE_KEY   # keygen 输出的 PKCS#8 hex
#   wrangler secret put ACTIVATION_PUBLIC_KEY    # keygen 输出的公钥 hex
# 本地调试可用 worker/.dev.vars（已 gitignore）：
#   ACTIVATION_PRIVATE_KEY=302e...04...
#   ACTIVATION_PUBLIC_KEY=你的公钥hex
